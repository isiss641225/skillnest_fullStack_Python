<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Visitas</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <!-- CSS propio -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="card">
        <h1>Contador de Visitas</h1>
        
        <!-- Muestra visitas enviadas desde app.py -->
        <p class="counter">Has visitado este sitio <strong>{{ visitas }}</strong> veces.</p>
        
        <!-- Muestra cantidad de reinicios -->
        <p class="reset-count">El contador se ha reiniciado <strong>{{ reinicios }}</strong> veces.</p>

        <div class="actions">
            <!-- Botón para sumar +2 -->
            <a href="{{ url_for('sumar_dos') }}" class="btn btn-primary">+2 Visitas</a>

            <!-- Botón para reiniciar -->
            <a href="{{ url_for('reiniciar') }}" class="btn btn-warning">Reiniciar Visitas</a>

            <!-- Nivel 1: Enlace para destruir la sesión -->
            <a href="{{ url_for('destruir_sesion') }}" class="btn btn-danger">Destruir Sesión</a>
        </div>

        <!-- Formulario para sumar cantidad personalizada -->
        <form action="{{ url_for('sumar') }}" method="POST" class="custom-form">
            <label for="cantidad">Aumentar visitas en:</label>
            <input type="number" id="cantidad" name="cantidad" min="1" required>
            <button type="submit" class="btn btn-secondary">Sumar</button>
        </form>
    </div>
</body>
</html>
