<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login y Registro</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .contenedor{
            width: 850px;
            margin: 40px auto;
            padding: 40px;
        }

        .formularios{
            display: flex;
            justify-content: space-between;
        }

        .caja{
            width: 42%;
        }

        h2{
            font-size: 35px;
            margin-bottom: 30px;
        }

        .grupo{
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        label{
            width: 160px;
        }

        input{
            width: 150px;
            height: 28px;
            border: 2px solid black;
        }

        button{
            margin-top: 15px;
            padding: 8px 18px;
            border: 3px solid black;
            background-color: white;
            box-shadow: 4px 4px 0px black;
        }

        .btn-login{
            margin-left: 40px;
        }

        .btn-registro{
            margin-left: 160px;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="formularios">

            <div class="caja">

                <h2>Inicio de Sesión</h2>

                <div class="grupo">
                    <label>E-mail</label>
                    <input type="email">
                </div>

                <div class="grupo">
                    <label>Contraseña</label>
                    <input type="password">
                </div>

                <button class="btn-login">Iniciar Sesión</button>

            </div>

            <div class="caja">

                <h2>Registro</h2>

                <div class="grupo">
                    <label>Nombre</label>
                    <input type="text">
                </div>

                <div class="grupo">
                    <label>E-mail</label>
                    <input type="email">
                </div>

                <div class="grupo">
                    <label>Contraseña</label>
                    <input type="password">
                </div>

                <div class="grupo">
                    <label>Conf. Contraseña</label>
                    <input type="password">
                </div>

                <button class="btn-registro">Registrar</button>

            </div>

        </div>

    </div>

</body>
</html>
