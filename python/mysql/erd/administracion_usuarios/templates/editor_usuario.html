<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Editar Usuario</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
        }

        .contenedor{
            width: 550px;
            margin: 40px auto;
            padding: 40px;
        }

        h1{
            text-align: center;
            margin-bottom: 40px;
        }

        .grupo{
            display: flex;
            align-items: center;
            margin-bottom: 18px;
        }

        label{
            width: 170px;
        }

        input, select{
            width: 180px;
            height: 30px;
            border: 2px solid black;
        }

        button{
            margin-left: 170px;
            padding: 8px 18px;
            border: 3px solid black;
            background-color: white;
            box-shadow: 4px 4px 0px black;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <h1>Editar Usuario</h1>

        <div class="grupo">
            <label>Nombre</label>
            <input type="text" value="Patricia">
        </div>

        <div class="grupo">
            <label>E-mail</label>
            <input type="email" value="patricia@codingdojo.com">
        </div>

        <div class="grupo">
            <label>Contraseña</label>
            <input type="password" value="123456">
        </div>

        <div class="grupo">
            <label>Conf. Contraseña</label>
            <input type="password" value="123456">
        </div>

        <div class="grupo">
            <label>Tipo de Usuario</label>

            <select>
                <option>Administrador</option>
                <option>Usuario</option>
            </select>
        </div>

        <button>Crear</button>

    </div>

</body>
</html>
